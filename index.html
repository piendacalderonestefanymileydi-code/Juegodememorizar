<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Civil - Juego de Memoria</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1a202c;
      color: #f7fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #3182ce;
      text-align: center;
    }

    .screen {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* Pantalla de Inicio */
    .hero {
      text-align: center;
      margin-top: 50px;
      background: #2d3748;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .hero h2 {
      margin-bottom: 15px;
      color: #e2e8f0;
    }

    .hero p {
      margin-bottom: 25px;
      color: #a0aec0;
    }

    .btn {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #2b6cb0;
      transform: translateY(-2px);
    }

    /* Selección de Dificultad y Nivel */
    .controls-panel {
      background: #2d3748;
      width: 100%;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      padding: 8px 12px;
      border-radius: 6px;
      background: #4a5568;
      color: white;
      border: 1px solid #718096;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Tablero de Juego */
    .grid {
      display: grid;
      gap: 12px;
      width: 100%;
      justify-content: center;
      perspective: 1000px;
    }

    /* Tarjetas */
    .card {
      background-color: transparent;
      aspect-ratio: 3/4;
      perspective: 1000px;
      cursor: pointer;
      min-width: 80px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s;
      transform-style: preserve-3d;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .card-front {
      background-color: #4a5568;
      border: 2px solid #718096;
      color: #cbd5e0;
      font-size: 1.8rem;
    }

    .card-back {
      background-color: #2d3748;
      border: 2px solid #3182ce;
      transform: rotateY(180deg);
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #63b3ed;
      margin-bottom: 4px;
      text-align: center;
      line-height: 1.1;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 70%;
      height: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img svg {
      width: 100%;
      height: 100%;
      fill: #e2e8f0;
    }

    .card.matched .card-back {
      border-color: #48bb78;
      background-color: #1a365d;
    }

    /* Mensaje de Victoria */
    .win-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .win-content {
      background: #2d3748;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
    }

    .win-content h2 {
      color: #48bb78;
      margin-bottom: 10px;
    }

    .win-content p {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>🏗️ Memory Civil Engine</h1>

  <!-- Pantalla de Inicio -->
  <div id="start-screen" class="screen hero">
    <h2>Entrena tu mente en Ingeniería Civil</h2>
    <p>Encuentra las parejas de herramientas, materiales y estructuras.</p>
    <button class="btn" id="start-btn">¡Jugar Ahora!</button>
  </div>

  <!-- Pantalla del Juego -->
  <div id="game-screen" class="screen hidden">
    
    <div class="controls-panel">
      <div class="selector-group">
        <label for="diff-select">Dificultad:</label>
        <select id="diff-select">
          <option value="facil">Fácil</option>
          <option value="dificil">Difícil</option>
          <option value="super-dificil">Súper Difícil</option>
        </select>
      </div>

      <div class="selector-group">
        <label for="level-select">Nivel:</label>
        <select id="level-select">
          <option value="1">Nivel 1</option>
          <option value="2">Nivel 2</option>
          <option value="3">Nivel 3</option>
          <option value="4">Nivel 4</option>
          <option value="5">Nivel 5</option>
        </select>
      </div>

      <div class="stats">
        <div>⏱️ <span id="timer">0</span>s</div>
        <div>🎯 Intentos: <span id="moves">0</span></div>
      </div>

      <button class="btn" id="restart-btn" style="padding: 6px 12px; font-size: 0.9rem;">Reiniciar</button>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <!-- Modal Victoria -->
  <div id="win-modal" class="win-modal hidden">
    <div class="win-content">
      <h2>¡Nivel Completado! 🎉</h2>
      <p id="win-stats">Lo lograste en 0 segundos y 0 movimientos.</p>
      <button class="btn" id="next-btn">Siguiente Nivel / Continuar</button>
    </div>
  </div>

  <script>
    // Base de datos de ítems de Ingeniería Civil con SVGs embebidos
    const CIVIL_ITEMS = [
      { id: 1, name: "Excavadora", svg: `<svg viewBox="0 0 24 24"><path d="M19 8h-2v3h-3l-2-3H8v2h3.27l1.33 2H4v3h2v2h2v-2h8v2h2v-2h3v-5l-2-2zM6 11H4V9h2v2z"/></svg>` },
      { id: 2, name: "Casco de Obra", svg: `<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9v2h18v-2c0-4.97-4.03-9-9-9zm-7 13h14v2H5z"/></svg>` },
      { id: 3, name: "Teodolito", svg: `<svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v2H7v2h2v2.17l-4.71 8.25 1.73 1L11 11.83V22h2v-10.17l4.98 8.59 1.73-1L15 11.17V9h2V7h-2V5a3 3 0 0 0-3-3z"/></svg>` },
      { id: 4, name: "Malla Electrosoldada", svg: `<svg viewBox="0 0 24 24"><path d="M2 2h20v20H2V2zm4 4v3h3V6H6zm5 0v3h3V6h-3zm5 0v3h3V6h-3zM6 11v3h3v-3H6zm5 0v3h3v-3h-3zm5 0v3h3v-3h-3zM6 16v3h3v-3H6zm5 0v3h3v-3h-3zm5 0v3h3v-3h-3z"/></svg>` },
      { id: 5, name: "Puente Colgante", svg: `<svg viewBox="0 0 24 24"><path d="M2 18h20v2H2v-2zm3-3h2v3H5v-3zm12 0h2v3h-2v-3zM2 9l3 6h2L4 9h16l-3 6h2l3-6V7H2v2z"/></svg>` },
      { id: 6, name: "Camión Mezclador", svg: `<svg viewBox="0 0 24 24"><path d="M7 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-9.8-4 7.2-4.2 1.4 2.4-7.2 4.2zM20 10h-2V6h-3l-5 4H2v6h3.1c.4 1.2 1.5 2 2.9 2s2.5-.8 2.9-2h4.2c.4 1.2 1.5 2 2.9 2s2.5-.8 2.9-2H22v-4l-2-2z"/></svg>` },
      { id: 7, name: "Plano Estructural", svg: `<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15h3v3H8v-3zm5 0h3v3h-3v-3zM8 10h8v2H8v-2z"/></svg>` },
      { id: 8, name: "Probeta de Concreto", svg: `<svg viewBox="0 0 24 24"><path d="M6 2h12v3H6V2zm1 5h10v14H7V7zm2 2v2h6V9H9zm0 4v2h6v-2H9z"/></svg>` },
      { id: 9, name: "Nivel de Mano", svg: `<svg viewBox="0 0 24 24"><path d="M2 8h20v8H2V8zm4 3v2h12v-2H6zm5 0h2v2h-2v-2z"/></svg>` },
      { id: 10, name: "Viga I-PE", svg: `<svg viewBox="0 0 24 24"><path d="M5 3h14v4h-4v10h4v4H5v-4h4V7H5V3z"/></svg>` },
      { id: 11, name: "Compactadora", svg: `<svg viewBox="0 0 24 24"><path d="M19 13c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm-12 0c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm11-8H6v3h12V5zM3 10h18v2H3v-2z"/></svg>` },
      { id: 12, name: "Zapata Aislada", svg: `<svg viewBox="0 0 24 24"><path d="M9 2h6v8h5l2 6v4H2v-4l2-6h5V2zm2 2v6h2V4h-2zm-5 8-1.33 4h14.66L18 12H6z"/></svg>` }
    ];

    // Configuración por dificultad y niveles (número de parejas)
    const CONFIG = {
      "facil": [3, 4, 4, 5, 6],           // Niveles 1 al 5
      "dificil": [6, 7, 8, 8, 9],
      "super-dificil": [9, 10, 10, 11, 12]
    };

    // Estado del juego
    let currentDiff = "facil";
    let currentLevel = 1;
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let totalPairs = 0;
    let moves = 0;
    let timer = 0;
    let timerInterval = null;
    let isLockBoard = false;

    // Elementos DOM
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const winModal = document.getElementById('win-modal');
    const grid = document.getElementById('grid');
    const diffSelect = document.getElementById('diff-select');
    const levelSelect = document.getElementById('level-select');
    const movesDisplay = document.getElementById('moves');
    const timerDisplay = document.getElementById('timer');

    // Event Listeners
    document.getElementById('start-btn').addEventListener('click', () => {
      startScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      initGame();
    });

    diffSelect.addEventListener('change', (e) => {
      currentDiff = e.target.value;
      initGame();
    });

    levelSelect.addEventListener('change', (e) => {
      currentLevel = parseInt(e.target.value);
      initGame();
    });

    document.getElementById('restart-btn').addEventListener('click', initGame);

    document.getElementById('next-btn').addEventListener('click', () => {
      winModal.classList.add('hidden');
      if (currentLevel < 5) {
        currentLevel++;
        levelSelect.value = currentLevel;
      } else {
        alert("¡Has completado todos los niveles de esta dificultad!");
      }
      initGame();
    });

    function startTimer() {
      clearInterval(timerInterval);
      timer = 0;
      timerDisplay.textContent = timer;
      timerInterval = setInterval(() => {
        timer++;
        timerDisplay.textContent = timer;
      }, 1000);
    }

    function initGame() {
      clearInterval(timerInterval);
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      isLockBoard = false;
      movesDisplay.textContent = moves;

      totalPairs = CONFIG[currentDiff][currentLevel - 1];
      
      // Seleccionar ítems aleatorios
      const shuffledItems = [...CIVIL_ITEMS].sort(() => 0.5 - Math.random());
      const selectedItems = shuffledItems.slice(0, totalPairs);
      
      // Duplicar para crear parejas
      cards = [...selectedItems, ...selectedItems].sort(() => 0.5 - Math.random());

      // Configurar columnas de la rejilla según la cantidad
      const totalCards = cards.length;
      let cols = 3;
      if (totalCards >= 12) cols = 4;
      if (totalCards >= 18) cols = 6;
      grid.style.gridTemplateColumns = `repeat(${cols}, minmax(80px, 110px))`;

      // Renderizar tablero
      grid.innerHTML = '';
      cards.forEach((item, index) => {
        const cardEl = document.createElement('div');
        cardEl.classList.add('card');
        cardEl.dataset.id = item.id;
        cardEl.dataset.index = index;

        cardEl.innerHTML = `
          <div class="card-inner">
            <div class="card-front">🧱</div>
            <div class="card-back">
              <div class="card-title">${item.name}</div>
              <div class="card-img">${item.svg}</div>
            </div>
          </div>
        `;

        cardEl.addEventListener('click', () => flipCard(cardEl));
        grid.appendChild(cardEl);
      });

      startTimer();
    }

    function flipCard(card) {
      if (isLockBoard) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesDisplay.textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.id === card2.dataset.id;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];

        if (matchedPairs === totalPairs) {
          clearInterval(timerInterval);
          setTimeout(showWinModal, 600);
        }
      } else {
        isLockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isLockBoard = false;
        }, 1000);
      }
    }

    function showWinModal() {
      document.getElementById('win-stats').textContent = 
        `Completaste el Nivel ${currentLevel} (${currentDiff.toUpperCase()}) en ${timer} segundos y ${moves} movimientos.`;
      winModal.classList.remove('hidden');
    }
  </script>
</body>
</html>
